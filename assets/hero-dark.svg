<title id="tt">worldcheck brand hero</title>
<desc id="dd">Particles converge on a checkpoint seal; the wordmark worldcheck and its commands sit below.</desc>
<style>
  .t  { font-family: 'JetBrains Mono','SF Mono',Menlo,Consolas,monospace; }
  .s  { font-family: -apple-system,'Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB',sans-serif; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .word { font: 600 56px 'JetBrains Mono','SF Mono',Menlo,Consolas,monospace; fill: #eefdfd; letter-spacing: 1px; }
  .tag { font: 400 20px -apple-system,'Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB',sans-serif; fill: #95aec4; letter-spacing: 2px; }
  .cmd { font: 500 15px 'JetBrains Mono','SF Mono',Menlo,Consolas,monospace; fill: #95aec4; }
  .k   { fill: #56ace6; }
  .seal-line { stroke: #56ace6; stroke-width: 2.5; fill: #0c141f; }
  .plus  { stroke: #acf3f6; stroke-width: 3; }
  .minus { stroke: #6a72e7; stroke-width: 3; }
  .halo  { fill: none; stroke: #56ace6; opacity: 0.35; animation: halo 5s ease-in-out infinite; }
  @keyframes halo { 0%,100% { opacity: 0.15; } 50% { opacity: 0.4; } }
</style>

